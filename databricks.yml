bundle:
  name: retail-analytics-databricks

include:
  - resources/*.yml

experimental:
  skip_name_prefix_for_schema: true

variables:
  catalog:
    description: Unity Catalog catalog used by the environment
    default: retail_analytics_dev

targets:
  dev:
    mode: development
    default: true

    variables:
      catalog: retail_analytics_dev

    workspace:
      host: https://dbc-2d40e698-7bc2.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev

    resources:
      schemas:

        bronze_schema:
          name: 1_bronze
          catalog_name: ${var.catalog}
          comment: Bronze layer for raw and incremental ingestion

        silver_schema:
          name: 2_silver
          catalog_name: ${var.catalog}
          comment: Silver layer for validated and standardized data

        gold_schema:
          name: 3_gold
          catalog_name: ${var.catalog}
          comment: Gold layer for dimensional modeling and analytics

        ml_schema:
          name: 5_ml
          catalog_name: ${var.catalog}
          comment: Machine Learning layer for features, predictions and monitoring

  prod:
    mode: production

    variables:
      catalog: retail_analytics

    workspace:
      host: https://dbc-2d40e698-7bc2.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod

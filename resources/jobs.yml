resources:
  jobs:
    retail_analytics_pipeline:
      name: Retail Analytics - Medallion & ML Pipeline

      tasks:

        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/03_silver_transformation.py

        - task_key: gold_modeling
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: ../notebooks/04_gold_modeling.py

        - task_key: sql_analytics
          depends_on:
            - task_key: gold_modeling
          notebook_task:
            notebook_path: ../notebooks/05_sql_analytics.py

        - task_key: ml_feature_refresh
          depends_on:
            - task_key: gold_modeling
          notebook_task:
            notebook_path: ../notebooks/11_ml_feature_refresh.py

        - task_key: sales_forecast_inference
          depends_on:
            - task_key: ml_feature_refresh
          notebook_task:
            notebook_path: ../notebooks/10_ml_sales_forecasting_inference.py

        - task_key: ml_monitoring
          depends_on:
            - task_key: sales_forecast_inference
          notebook_task:
            notebook_path: ../notebooks/12_ml_monitoring.py


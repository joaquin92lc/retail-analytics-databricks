
name: Databricks CI

# Ejecutar CI al abrir o actualizar un Pull Request hacia main.
on:
  pull_request:
    branches:
      - main

jobs:

  # JOB 1: Pruebas unitarias de Python.
  # Verifica la lógica del Quality Gate antes de validar Databricks.
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Preparar el entorno Python del proyecto.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Instalar las dependencias necesarias para las pruebas.
      - name: Install dependencies
        run: python -m pip install pytest

      # Ejecutar los tests. Si fallan, el job termina con error.
      - name: Run Quality Gate tests
        run: python -m pytest tests/ -v

  # JOB 2: Validación de Databricks Asset Bundles.
  # Solo se ejecuta si las pruebas unitarias finalizan correctamente.
  validate:
    name: Validate Databricks Bundle
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # Validar la configuración del bundle en el entorno DEV.
      # Las credenciales se obtienen de GitHub Secrets.
      - name: Validate DEV bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t dev
